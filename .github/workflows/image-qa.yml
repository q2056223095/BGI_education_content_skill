name: Education image text QA

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "templates/visual_text_spec*"
      - ".github/workflows/image-qa.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "templates/visual_text_spec*"
      - ".github/workflows/image-qa.yml"

jobs:
  quality-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Verify missing-text pages cannot pass
        run: python -m unittest discover -s tests -p "test_*.py" -v
